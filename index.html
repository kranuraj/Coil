function lineChart(series,w=innerWidth<=860?440:1000,hgt=innerWidth<=860?240:260){const all=series.flatMap(s=>s.pts.map(p=>p.v)),lo=Math.min(...all)*.98,hi=Math.max(...all)*1.02,n=series[0].pts.length;
 const X=i=>40+i*(w-60)/Math.max(1,n-1),Y=v=>hgt-24-(v-lo)/(hi-lo)*(hgt-40);
 const grid=[0,.25,.5,.75,1].map(t=>{const v=lo+(hi-lo)*t;return `<line x1="40" x2="${w-20}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="34" y="${Y(v)+4}" text-anchor="end" fill="var(--dim)" font-size="11">${((v-1)*100).toFixed(0)}%</text>`}).join('');
 const xl=series[0].pts.map((p,i)=>i%Math.ceil(n/6)===0?`<text x="${X(i)}" y="${hgt-6}" text-anchor="middle" fill="var(--dim)" font-size="11">${(p.d||'').slice(0,7)}</text>`:'').join('');
 return `<svg viewBox="0 0 ${w} ${hgt}" width="100%" style="display:block">${grid}${xl}${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" points="${s.pts.map((p,i)=>`${X(i)},${Y(p.v)}`).join(' ')}"/>`).join('')}</svg>`}
